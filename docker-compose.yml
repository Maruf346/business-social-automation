services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tatto_hysteria_backend

    command: >
      sh -c "
      python manage.py migrate &&
      gunicorn site_config.wsgi:application
      --bind 0.0.0.0:8007
      --workers 3
      --threads 2
      --timeout 120
      "

    volumes:
      - .:/app

    ports:
      - "8007:8007"

    env_file:
      - .env

    restart: always
  