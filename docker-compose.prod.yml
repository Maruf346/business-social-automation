services:
  db:
    image: postgres:16-alpine
    container_name: tattoo_hysteria_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tattoo_hysteria}
      POSTGRES_USER: ${POSTGRES_USER:-tattoo_hysteria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tattoo_hysteria_net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: tattoo_hysteria_redis
    networks:
      - tattoo_hysteria_net
    restart: unless-stopped

  backend:
    image: ${DOCKER_IMAGE:?DOCKER_IMAGE is required}
    container_name: tattoo_hysteria_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-tattoo_hysteria}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tattoo_hysteria}}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
    depends_on:
      - db
      - redis
    expose:
      - "8007"
    networks:
      - tattoo_hysteria_net
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: tattoo_hysteria_nginx
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tattoo_hysteria_net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  tattoo_hysteria_net:
    external: true
